# Одноразовый стек ТОЛЬКО для интеграционных тестов.
# Отдельные порты (5433/6380), чтобы не конфликтовать с твоими dev-контейнерами (5432/6379).
# Данные эфемерные (без volume): `down` стирает всё — тестам нужна чистота.
# Своё имя проекта — чтобы тестовый стек был изолирован от основного compose.
name: tg-bot-test
services:
  postgres-test:
    image: postgres:16
    container_name: tg_postgres_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tg_bot_test # база создаётся автоматически при старте
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tg_bot_test']
      interval: 2s
      timeout: 3s
      retries: 15

  redis-test:
    image: redis:7
    container_name: tg_redis_test
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 15
