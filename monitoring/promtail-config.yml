server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
    pipeline_stages:
      - match:
          selector: '{service="api"}'
          stages:
            - json:
                expressions:
                  level: level
                  msg: msg
                  context: context
                  req_method: req.method
                  req_url: req.url
            # Конвертируем числовой pino-уровень в строку
            - template:
                source: level
                template: '{{if eq .Value "10"}}trace{{else if eq .Value "20"}}debug{{else if eq .Value "30"}}info{{else if eq .Value "40"}}warn{{else if eq .Value "50"}}error{{else if eq .Value "60"}}fatal{{else}}{{.Value}}{{end}}'
            - labels:
                level:
            # Если msg пустой — берём context (nestjs-pino кладёт сообщение туда)
            - template:
                source: msg
                template: '{{if .Value}}{{.Value}}{{else}}{{.context}}{{end}}'
            # warn/error: добавляем [METHOD /url] если это HTTP-контекст
            - match:
                selector: '{level=~"warn|error|fatal"}'
                stages:
                  - template:
                      source: msg
                      template: '{{if .req_method}}[{{.req_method}} {{.req_url}}] {{.msg}}{{else}}{{.msg}}{{end}}'
            - output:
                source: msg
