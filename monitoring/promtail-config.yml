server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Имя контейнера → label "container" (убираем ведущий слэш)
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: container
      # Имя сервиса из docker-compose → label "service"
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
    pipeline_stages:
      # Парсим JSON только для api-контейнера (pino-логи)
      - match:
          selector: '{service="api"}'
          stages:
            - json:
                expressions:
                  level: level
                  req_id: reqId
                  msg: msg
            # конвертируем числовой pino-уровень в строку
            - template:
                source: level
                template: '{{if eq .Value "10"}}trace{{else if eq .Value "20"}}debug{{else if eq .Value "30"}}info{{else if eq .Value "40"}}warn{{else if eq .Value "50"}}error{{else if eq .Value "60"}}fatal{{else}}{{.Value}}{{end}}'
            # level выносим в label (низкая кардинальность — ok)
            - labels:
                level:
            # Финальный вывод — поле msg, остальное ищется через фильтры
            - output:
                source: msg
